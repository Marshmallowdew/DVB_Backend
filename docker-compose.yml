services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: car_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: carservice_redis
    restart: always
    ports:
      - "6379:6379"
  web:
    build: .
    restart: always
    # command: daphne -e ssl:8000:privateKey=key.pem:certKey=cert.pem core.asgi:application
    command: daphne -b 0.0.0.0 -p 8000 --verbosity 3 core.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - REDIS_HOST=redis

volumes:
  postgres_data: